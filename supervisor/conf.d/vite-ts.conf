[program:vite-ts]
process_name=%(program_name)s
user=debian
directory=/home/debian/panel/supervisor/services/vite-ts
command=/home/debian/.nvm/versions/node/v24.16.0/bin/npx vite preview
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/home/debian/panel/storage/logs/supervisor/vite-ts.log
stopwaitsecs=3600